# GitHub mematikan workflow terjadwal di repo yang 60 hari tanpa aktivitas. Blog yang sepi (tanpa perubahan) bisa kena.
# Workflow ini menyalakan ulang "Sinkron blog" lewat API tiap minggu; itu mereset hitungan 60 hari.
# (Ping Supabase tetap dikerjakan oleh repo situs utama, jadi tidak diulang di sini.)
name: Jaga aktif
on:
  schedule: [{cron: "23 2 * * 1"}]
  workflow_dispatch:
permissions:
  actions: write
concurrency: {group: jaga-aktif, cancel-in-progress: false}
jobs:
  jaga:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Nyalakan ulang workflow terjadwal
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          for f in sinkron.yml jaga-aktif.yml; do
            gh api -X PUT "/repos/${{ github.repository }}/actions/workflows/$f/enable" && echo "aktif: $f" || echo "lewati: $f"
          done
