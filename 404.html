<script>
/* 404.html: GitHub Pages menampilkannya untuk alamat yang belum ada. Alamat /<kategori>/<alamat> yang belum punya halaman statis
   (tulisan yang baru terbit, sebelum "Sinkron blog" selesai) dibuka lewat pembaca langsung di beranda (/?cat=&post=), yang membaca Supabase.
   Juga melayani /404.html?blog=<kategori>/<alamat> (dipakai tombol "Lihat" di admin). */
(function(){
var C="berita opini gaya-hidup hiburan wisata teknologi tips panduan-konser tips-gunung review komunitas".split(" ");
var m=location.pathname.match(/^\/([a-z0-9-]+)\/([a-z0-9]+(?:-[a-z0-9]+)*)\/?$/)||location.search.match(/[?&]blog=([a-z0-9-]+)(?:%2F|\/)([a-z0-9]+(?:-[a-z0-9]+)*)/);
if(m&&C.indexOf(m[1])>-1&&!/\.[a-z0-9]+$/i.test(location.pathname))location.replace("/?cat="+m[1]+"&post="+m[2]);
})();
</script>
